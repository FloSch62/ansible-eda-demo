---
# Fabric resources defined for the demo environment.
fabrics:
  - name: demo-fabric
    namespace: eda
    labels:
      demo.nokia.com/source: uv-ansible-toponodes
    spec:
      leafs:
        leafNodeSelector:
          - eda.nokia.com/role=leaf
      spines:
        spineNodeSelector:
          - eda.nokia.com/role=spine
      interSwitchLinks:
        linkSelector:
          - eda.nokia.com/role=interSwitch
        unnumbered: IPV6
        ipMTU: 9200
      systemPoolIPV4: nb-systemip-v4
      underlayProtocol:
        protocol:
          - EBGP
        bgp:
          asnPool: nb-asns
      overlayProtocol:
        protocol: EBGP
