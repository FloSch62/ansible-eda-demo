---
edge_interfaces:
  - name: edge-demo-leaf-1-ethernet-1-1
    namespace: eda
    labels:
      eda.nokia.com/macvrf201: "true"
      eda.nokia.com/macvrf1001: "true"
      eda.nokia.com/role: edge
    spec:
      enabled: true
      encapType: dot1q
      ethernet:
        speed: 10G
      members:
        - enabled: true
          interface: ethernet-1-1
          node: demo-leaf-1
      type: interface
  - name: edge-demo-leaf-2-ethernet-1-1
    namespace: eda
    labels:
      eda.nokia.com/macvrf202: "true"
      eda.nokia.com/macvrf1001: "true"
      eda.nokia.com/role: edge
    spec:
      enabled: true
      encapType: dot1q
      ethernet:
        speed: 10G
      members:
        - enabled: true
          interface: ethernet-1-1
          node: demo-leaf-2
      type: interface
  - name: edge-demo-leaf-3-ethernet-1-1
    namespace: eda
    labels:
      eda.nokia.com/macvrf201: "true"
      eda.nokia.com/macvrf1001: "true"
      eda.nokia.com/role: edge
    spec:
      enabled: true
      encapType: dot1q
      ethernet:
        speed: 10G
      members:
        - enabled: true
          interface: ethernet-1-1
          node: demo-leaf-3
      type: interface
  - name: edge-demo-leaf-4-ethernet-1-1
    namespace: eda
    labels:
      eda.nokia.com/macvrf202: "true"
      eda.nokia.com/macvrf1001: "true"
      eda.nokia.com/role: edge
    spec:
      enabled: true
      encapType: dot1q
      ethernet:
        speed: 10G
      members:
        - enabled: true
          interface: ethernet-1-1
          node: demo-leaf-4
      type: interface

virtual_networks:
  - name: macvrf1001
    namespace: eda
    spec:
      bridgeDomains:
        - name: macvrf1001
          spec:
            eviPool: evi-pool
            macAging: 300
            macLearning: true
            tunnelIndexPool: tunnel-index-pool
            type: EVPNVXLAN
            vniPool: vni-pool
      vlans:
        - name: macvrf1001
          spec:
            bridgeDomain: macvrf1001
            interfaceSelector:
              - eda.nokia.com/macvrf1001
            vlanID: "1001"
  - name: ipvrf2001
    namespace: eda-telemetry
    spec:
      bridgeDomains:
        - name: macvrf201
          spec:
            eviPool: evi-pool
            macAging: 300
            macLearning: true
            macLimit: 250
            tunnelIndexPool: tunnel-index-pool
            type: EVPNVXLAN
            vniPool: vni-pool
        - name: macvrf202
          spec:
            eviPool: evi-pool
            tunnelIndexPool: tunnel-index-pool
            type: EVPNVXLAN
            vniPool: vni-pool
      irbInterfaces:
        - name: macvrf201-irb
          spec:
            bridgeDomain: macvrf201
            ipAddresses:
              - ipv4Address:
                  ipPrefix: 10.20.1.254/24
                  primary: false
            ipMTU: 9200
            router: ipvrf2001
        - name: macvrf202-irb
          spec:
            bridgeDomain: macvrf202
            ipAddresses:
              - ipv4Address:
                  ipPrefix: 10.20.2.254/24
                  primary: false
            ipMTU: 9200
            router: ipvrf2001
      routers:
        - name: ipvrf2001
          spec:
            eviPool: evi-pool
            routerID: "2001"
            tunnelIndexPool: tunnel-index-pool
            type: EVPNVXLAN
            vniPool: vni-pool
      vlans:
        - name: macvrf201
          spec:
            bridgeDomain: macvrf201
            interfaceSelector:
              - eda.nokia.com/macvrf201
            vlanID: "201"
        - name: macvrf202
          spec:
            bridgeDomain: macvrf202
            interfaceSelector:
              - eda.nokia.com/macvrf202
            vlanID: "202"
