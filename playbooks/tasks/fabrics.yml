---
- name: Build Fabric custom resources (CR only)
  nokia.eda_fabrics_v1alpha1.fabric:
    base_url: "{{ eda_api_url }}"
    auth_token: "{{ eda_auth_token }}"
    tls_skip_verify: "{{ tls_skip_verify | bool }}"
    state: cronly
    resource: >-
      {{ lookup('ansible.builtin.template', playbook_dir ~ '/templates/fabric_resource.json.j2') | from_json }}
  loop: "{{ fabrics | default([]) }}"
  loop_control:
    label: "{{ item.name | default('fabric') }}"
  register: fabric_crs
  when: (fabrics | default([])) | length > 0
