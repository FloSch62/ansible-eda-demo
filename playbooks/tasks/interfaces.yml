---
- name: Build Interface custom resources (CR only)
  nokia.eda_interfaces_v1alpha1.interface:
    base_url: "{{ eda_api_url }}"
    auth_token: "{{ eda_auth_token }}"
    tls_skip_verify: "{{ tls_skip_verify | bool }}"
    state: cronly
    resource: "{{ {
      'metadata': (
        {
          'namespace': item.namespace | default(eda_namespace),
          'name': item.name,
          'labels': ({'demo.nokia.com/source': 'uv-ansible-toponodes'} | combine(item.labels | default({})))
        }
        | combine({'annotations': item.annotations} if (item.annotations is defined) else {})
      ),
      'spec': (
        {
          'type': item.type | default('interface'),
          'members': item.members
        }
        | combine({'description': item.description} if (item.description is defined) else {})
      )
    } | to_json | from_json }}"
  loop: "{{ topolink_interfaces }}"
  loop_control:
    label: "{{ item.name }}"
  register: interface_crs

- name: Cache topology interface change results
  ansible.builtin.set_fact:
    interface_resource_results: "{{ interface_crs.results | default([]) }}"
  when: interface_crs is defined

- name: Initialise interface change result list when unset
  ansible.builtin.set_fact:
    interface_resource_results: "{{ interface_resource_results | default([]) }}"

- name: Build edge Interface custom resources (CR only)
  nokia.eda_interfaces_v1alpha1.interface:
    base_url: "{{ eda_api_url }}"
    auth_token: "{{ eda_auth_token }}"
    tls_skip_verify: "{{ tls_skip_verify | bool }}"
    state: cronly
    resource: "{{ {
      'metadata': (
        {
          'namespace': item.namespace | default(eda_namespace),
          'name': item.name,
          'labels': ({'demo.nokia.com/source': 'uv-ansible-toponodes'} | combine(item.labels | default({})))
        }
        | combine({'annotations': item.annotations} if (item.annotations is defined) else {})
      ),
      'spec': item.spec
    } | to_json | from_json }}"
  loop: "{{ edge_interfaces | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: (edge_interfaces | default([])) | length > 0
  register: edge_interface_crs

- name: Append edge interface change results
  ansible.builtin.set_fact:
    interface_resource_results: "{{ interface_resource_results + edge_interface_crs.results }}"
  when: edge_interface_crs is defined
