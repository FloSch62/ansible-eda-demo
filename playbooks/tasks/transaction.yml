---
- name: Initialize transaction change set
  ansible.builtin.set_fact:
    transaction_crs: []

- name: Extend transaction change set with TopoNodes
  ansible.builtin.set_fact:
    transaction_crs: "{{ (transaction_crs | default([])) + [ {'type': { 'replace': {'value': item.result}}} ] }}"
  loop: "{{ topo_crs.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Extend transaction change set with Interfaces
  ansible.builtin.set_fact:
    transaction_crs: "{{ (transaction_crs | default([])) + [ {'type': { 'replace': {'value': item.result}}} ] }}"
  loop: "{{ interface_resource_results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Extend transaction change set with TopoLinks
  ansible.builtin.set_fact:
    transaction_crs: "{{ (transaction_crs | default([])) + [ {'type': { 'replace': {'value': item.result}}} ] }}"
  loop: "{{ topolink_crs.results }}"
  loop_control:
    label: "{{ item.item.name | default(item.result.metadata.name | default('TopoLink')) }}"

- name: Extend transaction change set with Fabrics
  ansible.builtin.set_fact:
    transaction_crs: "{{ (transaction_crs | default([])) + [ {'type': { 'replace': {'value': item.result}}} ] }}"
  loop: "{{ fabric_crs.results }}"
  loop_control:
    label: "{{ item.item.name | default(item.result.metadata.name | default('Fabric')) }}"
  when: fabric_crs is defined and (fabric_crs.results | length) > 0

- name: Extend transaction change set with VirtualNetworks
  ansible.builtin.set_fact:
    transaction_crs: "{{ (transaction_crs | default([])) + [ {'type': { 'replace': {'value': item.result}}} ] }}"
  loop: "{{ virtual_network_resource_results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default(item.result.metadata.name | default('VirtualNetwork')) }}"
  when: (virtual_network_resource_results | default([])) | length > 0

- name: Prepare transaction resource summary
  ansible.builtin.set_fact:
    transaction_resource_summary: >-
      {%- set counts = [
        ('TopoNode', topo_crs.results | default([]) | length),
        ('Interface', interface_resource_results | default([]) | length),
        ('TopoLink', topolink_crs.results | default([]) | length),
        ('Fabric', (fabric_crs.results if (fabric_crs is defined) else []) | length),
        ('VirtualNetwork', virtual_network_resource_results | default([]) | length)
      ] -%}
      {%- set parts = [] -%}
      {%- for label, count in counts if (count | int) > 0 -%}
        {%- set plural = '' if (count | int) == 1 else 's' -%}
        {%- set _ = parts.append((count | int | string) ~ ' ' ~ label ~ plural) -%}
      {%- endfor -%}
      {%- if parts | length > 0 -%}
        {{ parts | join(', ') }}
      {%- else -%}
        no resources
      {%- endif -%}

- name: Submit dry run transaction for TopoNodes, Interfaces, and TopoLinks
  nokia.eda_core_v1.transaction.v2.transaction:
    base_url: "{{ eda_api_url }}"
    auth_token: "{{ eda_auth_token }}"
    tls_skip_verify: "{{ tls_skip_verify | bool }}"
    description: "{{ transaction_description }} (dry run)"
    dryRun: true
    resultType: normal
    retain: true
    crs: "{{ transaction_crs }}"
  register: transaction_dry_run

- name: Display dry run transaction identifier
  ansible.builtin.debug:
    msg: "Submitted dry run transaction {{ transaction_dry_run.result.id }} for {{ transaction_crs | length }} resources"

- name: Wait for dry run execution result
  nokia.eda_core_v1.transaction.v2.result.execution:
    base_url: "{{ eda_api_url }}"
    auth_token: "{{ eda_auth_token }}"
    tls_skip_verify: "{{ tls_skip_verify | bool }}"
    transactionId: "{{ transaction_dry_run.result.id }}"
    waitForComplete: true
    failOnErrors: true
  register: transaction_dry_run_execution

- name: Summarize dry run outcome
  ansible.builtin.debug:
    msg:
      summary: "Dry run {{ transaction_dry_run.result.id }} completed: {{ transaction_dry_run_execution.result.executionSummary | default('no execution summary returned') | replace('µ', 'u') }}."
      proposed_resources: "{{ transaction_resource_summary }}"

- name: Submit transaction for TopoNodes, Interfaces, and TopoLinks
  nokia.eda_core_v1.transaction.v2.transaction:
    base_url: "{{ eda_api_url }}"
    auth_token: "{{ eda_auth_token }}"
    tls_skip_verify: "{{ tls_skip_verify | bool }}"
    description: "{{ transaction_description }}"
    dryRun: false
    resultType: normal
    retain: true
    crs: "{{ transaction_crs }}"
  register: transaction
  when: transaction_dry_run_execution is success

- name: Display transaction identifier
  ansible.builtin.debug:
    msg: "Submitted transaction {{ transaction.result.id }} for {{ transaction_crs | length }} resources"
  when: transaction_dry_run_execution is success

- name: Wait for transaction execution result
  nokia.eda_core_v1.transaction.v2.result.execution:
    base_url: "{{ eda_api_url }}"
    auth_token: "{{ eda_auth_token }}"
    tls_skip_verify: "{{ tls_skip_verify | bool }}"
    transactionId: "{{ transaction.result.id }}"
    waitForComplete: true
    failOnErrors: true
  register: transaction_execution
  when: transaction_dry_run_execution is success

- name: Initialise changed resource summary list
  ansible.builtin.set_fact:
    transaction_changed_resource_lines: []
  when: transaction_dry_run_execution is success

- name: Collect changed resource summary lines
  ansible.builtin.set_fact:
    transaction_changed_resource_lines: "{{ transaction_changed_resource_lines + [line_text] }}"
  vars:
    joined_names: "{{ item.names | default([]) | join(', ') }}"
    display_group: "{{ item.gvk.group | default('unknown') }}"
    display_kind: "{{ item.gvk.kind | default('Resource') }}"
    display_version: "{{ item.gvk.version | default('') }}"
    namespace_value: "{{ item.namespace | default('-') }}"
    line_text: >-
      {{ display_kind }} ({{ display_group }}{{ '/' + display_version if display_version else '' }}):
      {{ joined_names if joined_names | length > 0 else '(no names)' }} [ns={{ namespace_value }}]
  loop: "{{ transaction_execution.result.changedCrs | default([]) }}"
  loop_control:
    label: "{{ item.gvk.kind | default(item.namespace | default('resource')) }}"
  when: transaction_dry_run_execution is success

- name: Summarize transaction outcome
  ansible.builtin.debug:
    msg:
      summary: "Transaction {{ transaction.result.id }} completed: {{ transaction_execution.result.executionSummary | default('no execution summary returned') | replace('µ', 'u') }}."
      changed_crs:
        count: "{{ transaction_execution.result.changedCrs | default([]) | length }}"
        resources: "{{ transaction_changed_resource_lines }}"
      nodes_with_config_changes: "{{ transaction_execution.result.nodesWithConfigChanges | default([]) | length }}"
      topology_supported: "{{ (transaction_execution.result.topologySupported | default(false)) | ternary('yes', 'no') }}"
  when: transaction_dry_run_execution is success
