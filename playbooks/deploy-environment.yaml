---
- name: Build NetBox-driven EDA transaction
  hosts: localhost
  gather_facts: false
  vars:
    transaction_manifest_path: "{{ playbook_dir }}/artifacts/eda-transaction.yaml"
    transaction_description: "{{ eda_transaction_description | default('NetBox topology transaction') }}"
  vars_files:
    - ../vars/fabrics/fabrics.yml

  pre_tasks:
    - name: Skip environment deployment when disabled
      ansible.builtin.meta: end_play
      when: not (run_environment_deploy | default(true) | bool)

    - name: Ensure fabric list is defined
      ansible.builtin.set_fact:
        fabrics: []
      when: fabrics is not defined

  tasks:
    - name: Collect topology data from NetBox
      ansible.builtin.include_tasks: tasks/netbox_topology.yml

    - name: Build transaction manifest from topology data
      ansible.builtin.include_tasks: tasks/build_transaction.yml

    - name: Execute Nokia EDA transaction
      ansible.builtin.include_tasks: tasks/execute_transaction.yml
